name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          rustc --version || rustup toolchain install stable --profile minimal
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Build and compare
        run: python tools/fir_parity.py
      - name: Tests
        run: python -m pytest -q
      - name: Package
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*
            reports/parity.json
